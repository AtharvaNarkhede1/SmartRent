services:
  # Backend API Service
  - type: web
    name: smartrent-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: static
    name: smartrent-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to your backend URL e.g. https://smartrent-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
